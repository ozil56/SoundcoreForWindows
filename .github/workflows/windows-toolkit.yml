name: Windows toolkit

on:
  push:
    branches: [main]
    paths:
      - 'windows-toolkit/**'
      - '.github/workflows/windows-toolkit.yml'
  pull_request:
    paths:
      - 'windows-toolkit/**'
      - '.github/workflows/windows-toolkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: windows-toolkit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            windows-toolkit/microphone-requirements.txt
            windows-toolkit/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test without Bluetooth hardware
        run: python -m unittest discover -p "test_*.py" -v
      - name: Build portable package
        run: python build_release.py
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoundcoreForWindows-windows-x64
          path: |
            windows-toolkit/release/*.zip
            windows-toolkit/release/*.sha256
          if-no-files-found: error
          retention-days: 14
